<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>크리스마스 LED 천장 프로젝터</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    }

    #projectorCanvas {
      position: fixed;
      inset: 0;
      display: block;
      width: 100vw;
      height: 100vh;
      background-color: #000000;
    }

    /* 상단 안내 토스트 */
    #toastBanner {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      padding: 10px 20px;
      border-radius: 9999px;
      background: rgba(18, 18, 22, 0.94);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: #fde68a;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.85);
      transition: opacity 0.45s ease;
      opacity: 0;
      pointer-events: none;
    }

    #toastBanner.show {
      opacity: 1;
    }

    /* 하단 플로팅 컨트롤 바 */
    #hudContainer {
      position: fixed;
      bottom: 18px;
      left: 50%;
      width: 95%;
      max-width: 880px;
      z-index: 40;
      transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1), transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #hudContainer.hud-hidden {
      opacity: 0;
      transform: translate(-50%, 26px);
      pointer-events: none;
    }

    #hudContainer.hud-visible {
      opacity: 1;
      transform: translate(-50%, 0);
      pointer-events: auto;
    }

    .hud-panel {
      background: rgba(12, 12, 16, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 14px 16px;
      box-shadow: 0 12px 45px rgba(0, 0, 0, 0.95);
    }

    .hud-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 10px #34d399;
    }

    .top-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.12s, border-color 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .action-btn:active {
      transform: scale(0.96);
    }

    .action-btn.music-on {
      border-color: rgba(251, 191, 36, 0.55);
      background: rgba(245, 158, 11, 0.18);
      color: #fde68a;
    }

    .action-btn.primary-btn {
      background: #f59e0b;
      border-color: #fbbf24;
      color: #090d16;
      font-weight: 700;
      box-shadow: 0 0 18px rgba(245, 158, 11, 0.4);
    }

    .action-btn.primary-btn:hover {
      background: #fbbf24;
    }

    .hud-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding-top: 12px;
    }

    @media (max-width: 640px) {
      .hud-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .hud-panel {
        padding: 12px;
      }
    }

    .control-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
    }

    .seg-group {
      display: grid;
      gap: 4px;
      background: rgba(0, 0, 0, 0.65);
      padding: 4px;
      border-radius: 10px;
    }

    .seg-3 {
      grid-template-columns: repeat(3, 1fr);
    }

    .seg-2 {
      grid-template-columns: repeat(2, 1fr);
    }

    .seg-btn {
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 4px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.18s;
    }

    .seg-btn:hover {
      color: #ffffff;
    }

    .seg-btn.active {
      background: rgba(255, 255, 255, 0.16);
      color: #fcd34d;
      font-weight: 700;
    }

    /* LG 빔프로젝터 리모컨 포커스 표시 */
    button:focus-visible {
      outline: 2px solid #fbbf24;
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <!-- 전체화면 투사 캔버스 -->
  <canvas id="projectorCanvas"></canvas>

  <!-- 상단 안내 메시지 -->

  <!-- 하단 자동 숨김 플로팅 컨트롤 바 -->
  <div id="hudContainer" class="hud-visible">
    <div class="hud-panel">
      <div class="hud-top">
        <div class="brand-title">
          <span class="status-dot"></span>
          <span>크리스마스 LED 천장 프로젝터</span>
        </div>

        <div class="top-actions">
          <!-- 오르골 자장가 토글 -->
          <button id="musicBtn" type="button" class="action-btn">
            <span id="musicEmoji">🔇</span>

          <!-- 전체화면 버튼 -->

      <div class="hud-grid">
        <!-- 1. 아이콘 밀도 -->

          <div class="seg-group seg-3">
            <button type="button" data-density="medium" class="seg-btn density-btn">보통</button>
            <button type="button" data-density="high" class="seg-btn density-btn active">많음</button>
            <button type="button" data-density="ultra" class="seg-btn density-btn">가득</button>
          </div>
        </div>

        <!-- 2. 움직임 속도 -->
        <div class="control-card">
          <span class="control-label">움직임 속도</span>
          <div class="seg-group seg-3">
            <button type="button" data-speed="slow" class="seg-btn speed-btn">느리게</button>
            <button type="button" data-speed="normal" class="seg-btn speed-btn active">보통</button>
            <button type="button" data-speed="fast" class="seg-btn speed-btn">빠르게</button>
          </div>
        </div>

        <!-- 3. 조명 테마 -->
        <div class="control-card">
          <span class="control-label">조명 테마</span>

            <button type="button" data-theme="classic" class="seg-btn theme-btn active">클래식 LED</button>
            <button type="button" data-theme="aurora" class="seg-btn theme-btn">오로라 + LED</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('projectorCanvas');
      const ctx = canvas.getContext('2d', { alpha: false });

      function getSafeDimensions() {
        const w = window.innerWidth || document.documentElement.clientWidth || 1280;
        const h = window.innerHeight || document.documentElement.clientHeight || 720;
        return {
          width: w > 0 ? w : 1280,
          height: h > 0 ? h : 720
        };
      }

      const initialDims = getSafeDimensions();

      const state = {
        width: initialDims.width,
        height: initialDims.height,
        dpr: Math.min(window.devicePixelRatio || 1, 2),
        density: 'high',
        speedKey: 'normal',
        speedMultiplier: 1.0,
        theme: 'classic',
        isMusicOn: false,
        lastTime: performance.now(),
        elapsed: 0
      };

      const DENSITY_MAP = {
        medium: 28,
        high: 54,
        ultra: 84
      };

      const SPEED_MAP = {
        slow: 0.45,
        normal: 1.0,
        fast: 1.85
      };

      const sprites = {};
      let icons = [];
      let stars = [];
      let microSnow = [];

      /**
       * 오프스크린 고화질 LED 스프라이트 생성 (6종)
       */
      function createSpriteCanvas(drawFn) {
        const size = 240;
        const off = document.createElement('canvas');
        off.width = size;
        off.height = size;
        const c = off.getContext('2d');
        c.translate(size / 2, size / 2);
        drawFn(c);
        return off;
      }

      function buildSprites() {
        // 1. 귀여운 산타클로스
        sprites.santa = createSpriteCanvas((c) => {
          c.shadowColor = 'rgba(255, 85, 85, 0.85)';
          c.shadowBlur = 22;

          // 빨간 몸통
          c.fillStyle = '#ef4444';
          c.beginPath();
          c.roundRect(-42, 4, 84, 62, 24);
          c.fill();

          // 검은 벨트 & 황금 버클
          c.shadowBlur = 0;
          c.fillStyle = '#18181b';
          c.fillRect(-41, 32, 82, 12);
          c.strokeStyle = '#fbbf24';
          c.lineWidth = 4;
          c.strokeRect(-12, 29, 24, 18);

          // 얼굴
          c.fillStyle = '#fed7aa';
          c.beginPath();
          c.arc(0, -14, 24, 0, Math.PI * 2);
          c.fill();

          // 풍성한 흰 수염
          c.shadowColor = 'rgba(255, 255, 255, 0.75)';
          c.shadowBlur = 12;
          c.fillStyle = '#ffffff';
          c.beginPath();
          c.moveTo(-25, -10);
          c.quadraticCurveTo(-30, 22, 0, 26);
          c.quadraticCurveTo(30, 22, 25, -10);
          c.quadraticCurveTo(0, -2, -25, -10);
          c.closePath();
          c.fill();

          // 눈 & 빨간 코
          c.shadowBlur = 0;
          c.fillStyle = '#1e293b';
          c.beginPath();
          c.arc(-8, -17, 2.7, 0, Math.PI * 2);
          c.arc(8, -17, 2.7, 0, Math.PI * 2);
          c.fill();

          c.fillStyle = '#f87171';
          c.beginPath();
          c.arc(0, -11, 4.2, 0, Math.PI * 2);
          c.fill();

          // 산타 모자
          c.shadowColor = 'rgba(239, 68, 68, 0.8)';
          c.shadowBlur = 14;
          c.fillStyle = '#ef4444';
          c.beginPath();
          c.moveTo(-25, -24);
          c.quadraticCurveTo(-6, -64, 34, -44);
          c.quadraticCurveTo(18, -30, 25, -24);
          c.closePath();
          c.fill();

          // 모자 흰 테두리 & 방울
          c.shadowBlur = 10;
          c.shadowColor = '#ffffff';
          c.fillStyle = '#ffffff';
          c.beginPath();
          c.roundRect(-27, -28, 54, 10, 5);
          c.fill();
          c.beginPath();
          c.arc(36, -43, 7, 0, Math.PI * 2);
          c.fill();
        });

        // 2. 깔끔한 눈사람 (경로 분리로 삼각형 잔상 완전 제거)
        sprites.snowman = createSpriteCanvas((c) => {
          // 나뭇가지 팔 (먼저 뒤쪽에 그리기)
          c.strokeStyle = '#d97706';
          c.lineWidth = 4.2;
          c.lineCap = 'round';
          c.beginPath();
          c.moveTo(-30, 14);
          c.lineTo(-56, -4);
          c.moveTo(-47, 2);
          c.lineTo(-54, -12);
          c.moveTo(30, 14);
          c.lineTo(56, -4);
          c.moveTo(47, 2);
          c.lineTo(54, -12);
          c.stroke();

          // 아래 눈덩이 (몸통)
          c.save();
          c.shadowColor = 'rgba(186, 230, 253, 0.95)';
          c.shadowBlur = 20;
          c.fillStyle = '#ffffff';
          c.beginPath();
          c.arc(0, 34, 35, 0, Math.PI * 2);
          c.fill();
          c.restore();

          // 위 눈덩이 (머리)
          c.save();
          c.shadowColor = 'rgba(224, 242, 254, 0.95)';
          c.shadowBlur = 16;
          c.fillStyle = '#ffffff';
          c.beginPath();
          c.arc(0, -12, 24, 0, Math.PI * 2);
          c.fill();
          c.restore();

          // 빨강·초록 목도리
          c.fillStyle = '#ef4444';
          c.beginPath();
          c.roundRect(-22, 6, 44, 10, 5);
          c.fill();

          c.fillStyle = '#22c55e';
          c.beginPath();
          c.roundRect(7, 11, 11, 24, 4);
          c.fill();

          // 까만 두 눈
          c.fillStyle = '#0f172a';
          c.beginPath();
          c.arc(-8, -17, 2.8, 0, Math.PI * 2);
          c.fill();
          c.beginPath();
          c.arc(8, -17, 2.8, 0, Math.PI * 2);
          c.fill();

          // 주황 당근 코
          c.fillStyle = '#f97316';
          c.beginPath();
          c.moveTo(0, -13);
          c.lineTo(17, -10);
          c.lineTo(0, -7);
          c.closePath();
          c.fill();

          // 미소 짓는 입
          c.strokeStyle = '#0f172a';
          c.lineWidth = 2.4;
          c.lineCap = 'round';
          c.beginPath();
          c.arc(0, -9, 10, 0.22 * Math.PI, 0.78 * Math.PI);
          c.stroke();

          // 몸통 단추 3개
          c.fillStyle = '#0f172a';
          [-2, 12, 26].forEach((offsetY) => {
            c.beginPath();
            c.arc(0, 26 + offsetY * 0.65, 2.8, 0, Math.PI * 2);
            c.fill();
          });

          // 검은 중절모 & 빨간 띠
          c.fillStyle = '#1e293b';
          c.beginPath();
          c.roundRect(-25, -36, 50, 6, 3);
          c.fill();
          c.beginPath();
          c.roundRect(-16, -60, 32, 25, 4);
          c.fill();

          c.fillStyle = '#ef4444';
          c.fillRect(-16, -42, 32, 5);
        });

        // 3. 황금 징글벨 & 빨간 리본
        sprites.bell = createSpriteCanvas((c) => {
          // 종 아래 구슬
          c.fillStyle = '#d97706';
          c.beginPath();
          c.arc(0, 46, 11, 0, Math.PI * 2);
          c.fill();

          // 황금 종 본체
          c.save();
          c.shadowColor = 'rgba(250, 204, 21, 0.95)';
          c.shadowBlur = 24;
          const bellGrad = c.createLinearGradient(-38, -32, 38, 42);
          bellGrad.addColorStop(0, '#fef08a');
          bellGrad.addColorStop(0.5, '#facc15');
          bellGrad.addColorStop(1, '#ca8a04');
          c.fillStyle = bellGrad;
          c.beginPath();
          c.moveTo(0, -36);
          c.bezierCurveTo(28, -36, 34, -4, 42, 26);
          c.quadraticCurveTo(48, 38, 36, 42);
          c.lineTo(-36, 42);
          c.quadraticCurveTo(-48, 38, -42, 26);
          c.bezierCurveTo(-34, -4, -28, -36, 0, -36);
          c.closePath();
          c.fill();
          c.restore();

          // 종 테두리 띠 & 광택선
          c.fillStyle = '#fef9c3';
          c.beginPath();
          c.roundRect(-38, 28, 76, 6, 3);
          c.fill();

          c.strokeStyle = 'rgba(255, 255, 255, 0.85)';
          c.lineWidth = 4;
          c.lineCap = 'round';
          c.beginPath();
          c.moveTo(-14, -20);
          c.quadraticCurveTo(-22, 0, -25, 20);
          c.stroke();

          // 상단 초록 호랑가시나무 잎
          c.fillStyle = '#22c55e';
          c.beginPath();
          c.ellipse(-22, -38, 16, 8, -0.35, 0, Math.PI * 2);
          c.fill();
          c.beginPath();
          c.ellipse(22, -38, 16, 8, 0.35, 0, Math.PI * 2);
          c.fill();

          // 상단 빨간 리본
          c.save();
          c.shadowColor = 'rgba(239, 68, 68, 0.85)';
          c.shadowBlur = 12;
          c.fillStyle = '#ef4444';
          c.beginPath();
          c.moveTo(0, -40);
          c.bezierCurveTo(-24, -58, -32, -26, 0, -36);
          c.fill();
          c.beginPath();
          c.moveTo(0, -40);
          c.bezierCurveTo(24, -58, 32, -26, 0, -36);
          c.fill();
          c.beginPath();
          c.arc(0, -38, 7, 0, Math.PI * 2);
          c.fill();
          c.restore();
        });

        // 4. 반짝이는 크리스마스 트리
        sprites.tree = createSpriteCanvas((c) => {
          // 나무 기둥
          c.fillStyle = '#b45309';
          c.fillRect(-11, 44, 22, 22);

          // 3단 초록 잎
          c.save();
          c.shadowColor = 'rgba(34, 197, 94, 0.9)';
          c.shadowBlur = 22;
          c.fillStyle = '#22c55e';

          const tiers = [
            { top: -54, bottom: -10, width: 32 },
            { top: -26, bottom: 20, width: 46 },
            { top: 4, bottom: 48, width: 58 }
          ];
          tiers.forEach((t) => {
            c.beginPath();
            c.moveTo(0, t.top);
            c.lineTo(-t.width, t.bottom);
            c.lineTo(t.width, t.bottom);
            c.closePath();
            c.fill();
          });
          c.restore();

          // 꼭대기 황금 별
          c.save();
          c.shadowColor = '#fde047';
          c.shadowBlur = 18;
          c.fillStyle = '#fde047';
          drawStarPath(c, 0, -62, 5, 14, 6);
          c.fill();
          c.restore();

          // 오너먼트 전구
          const ornaments = [
            { x: -10, y: -22, col: '#f87171' },
            { x: 12, y: -16, col: '#fde047' },
            { x: -18, y: 8, col: '#38bdf8' },
            { x: 4, y: 12, col: '#f472b6' },
            { x: 22, y: 10, col: '#f87171' },
            { x: -26, y: 36, col: '#fde047' },
            { x: -4, y: 38, col: '#38bdf8' },
            { x: 20, y: 35, col: '#f472b6' }
          ];
          ornaments.forEach((o) => {
            c.save();
            c.shadowColor = o.col;
            c.shadowBlur = 10;
            c.fillStyle = o.col;
            c.beginPath();
            c.arc(o.x, o.y, 4.8, 0, Math.PI * 2);
            c.fill();
            c.restore();
          });
        });

        // 5. 결정 눈송이
        sprites.snowflake = createSpriteCanvas((c) => {
          c.save();
          c.shadowColor = 'rgba(125, 211, 252, 0.95)';
          c.shadowBlur = 22;
          c.strokeStyle = '#e0f2fe';
          c.lineCap = 'round';

          for (let i = 0; i < 6; i++) {
            c.save();
            c.rotate((i * Math.PI) / 3);

            c.lineWidth = 6;
            c.beginPath();
            c.moveTo(0, 0);
            c.lineTo(0, -64);
            c.stroke();

            c.lineWidth = 4.2;
            c.beginPath();
            c.moveTo(0, -28);
            c.lineTo(-16, -42);
            c.moveTo(0, -28);
            c.lineTo(16, -42);
            c.moveTo(0, -46);
            c.lineTo(-12, -57);
            c.moveTo(0, -46);
            c.lineTo(12, -57);
            c.stroke();

            c.restore();
          }

          c.fillStyle = '#ffffff';
          c.beginPath();
          c.arc(0, 0, 8, 0, Math.PI * 2);
          c.fill();
          c.restore();
        });

        // 6. 지팡이 사탕 (캔디케인)
        sprites.candy = createSpriteCanvas((c) => {
          c.save();
          c.shadowColor = 'rgba(248, 113, 113, 0.85)';
          c.shadowBlur = 18;
          c.lineCap = 'round';

          c.strokeStyle = '#ffffff';
          c.lineWidth = 20;
          c.beginPath();
          c.moveTo(14, 52);
          c.lineTo(14, -22);
          c.arc(-6, -22, 20, 0, Math.PI, true);
          c.stroke();

          c.strokeStyle = '#ef4444';
          c.lineWidth = 20;
          c.setLineDash([14, 16]);
          c.beginPath();
          c.moveTo(14, 52);
          c.lineTo(14, -22);
          c.arc(-6, -22, 20, 0, Math.PI, true);
          c.stroke();
          c.restore();
        });
      }

      function drawStarPath(c, cx, cy, spikes, outerR, innerR) {
        let rot = (Math.PI / 2) * 3;
        const step = Math.PI / spikes;
        c.beginPath();
        c.moveTo(cx, cy - outerR);
        for (let i = 0; i < spikes; i++) {
          c.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
          rot += step;
          c.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
          rot += step;
        }
        c.closePath();
      }

      /**
       * 전체 투사 씬 파티클 구성
       */
      function populateScene() {
        const targetCount = DENSITY_MAP[state.density] || 54;
        const iconTypes = ['santa', 'snowman', 'bell', 'tree', 'snowflake', 'candy'];

        const pad = 100;
        const densityFactor = state.density === 'ultra' ? 2.2 : state.density === 'high' ? 1.6 : 1.0;
        const starCount = Math.min(240, Math.max(50, Math.floor(((state.width * state.height) / 11000) * densityFactor)));

        stars = Array.from({ length: starCount }, () => ({
          x: Math.random() * state.width,
          y: Math.random() * state.height,
          radius: 1 + Math.random() * 2.3,
          phase: Math.random() * Math.PI * 2,
          twinkleSpeed: 0.9 + Math.random() * 2.0,
          color: ['#ffffff', '#fde047', '#7dd3fc', '#fda4af', '#6ee7b7'][Math.floor(Math.random() * 5)]
        }));

        const microCount = state.density === 'ultra' ? 48 : state.density === 'high' ? 30 : 14;
        microSnow = Array.from({ length: microCount }, () => ({
          x: Math.random() * state.width,
          y: Math.random() * state.height,
          vx: (Math.random() - 0.5) * 16,
          vy: 10 + Math.random() * 20,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() > 0.5 ? 1 : -1) * (0.4 + Math.random() * 0.8),
          scale: 0.15 + Math.random() * 0.15,
          alpha: 0.4 + Math.random() * 0.45
        }));

        icons = [];
        const aspect = state.width / Math.max(state.height, 1);
        const cols = Math.max(3, Math.ceil(Math.sqrt(targetCount * aspect)));
        const rows = Math.max(2, Math.ceil(targetCount / cols));
        const cellW = (state.width + pad * 2) / cols;
        const cellH = (state.height + pad * 2) / rows;
        const mobileFactor = Math.min(state.width, state.height) < 600 ? 0.78 : 1.0;

        for (let i = 0; i < targetCount; i++) {
          const type = iconTypes[i % iconTypes.length];
          const col = i % cols;
          const row = Math.floor(i / cols);

          const x = -pad + col * cellW + (0.15 + Math.random() * 0.7) * cellW;
          const y = -pad + row * cellH + (0.15 + Math.random() * 0.7) * cellH;

          const layer = i % 3;
          let baseScale;
          if (layer === 0) {
            baseScale = (0.34 + Math.random() * 0.10) * mobileFactor;
          } else if (layer === 1) {
            baseScale = (0.50 + Math.random() * 0.12) * mobileFactor;
          } else {
            baseScale = (0.66 + Math.random() * 0.15) * mobileFactor;
          }

          const parallax = 0.65 + layer * 0.28;
          const isFullSpin = type === 'snowflake';

          icons.push({
            type,
            layer,
            x,
            y,
            vx: (Math.random() - 0.5) * 26 * parallax,
            vy: (Math.random() - 0.5) * 22 * parallax,
            angle: 0,
            isFullSpin,
            spinSpeed: isFullSpin
              ? (Math.random() > 0.5 ? 1 : -1) * (0.25 + Math.random() * 0.4)
              : (0.8 + Math.random() * 0.7),
            swayPhase: Math.random() * Math.PI * 2,
            swayAmp: 0.15 + Math.random() * 0.14,
            scale: baseScale,
            pulsePhase: Math.random() * Math.PI * 2
          });
        }

        icons.sort((a, b) => a.layer - b.layer);
      }

      /**
       * 캔버스 리사이즈 동기화
       */
      function syncCanvasSize(repopulate) {
        const dims = getSafeDimensions();
        state.width = dims.width;
        state.height = dims.height;
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

        if (repopulate) {
          populateScene();
        }
      }

      /**
       * 메인 60fps 렌더링 루프
       */
      function animate(now) {
        try {
          const rawDt = Math.min(Math.max((now - state.lastTime) / 1000, 0.001), 0.1);
          state.lastTime = now;
          const dt = rawDt * state.speedMultiplier;
          state.elapsed += dt;

          // 완전한 검은 배경 (#000000)
          ctx.fillStyle = '#000000';
          ctx.fillRect(0, 0, state.width, state.height);

          // 오로라 테마 오버레이
          if (state.theme === 'aurora') {
            ctx.save();
            ctx.globalCompositeOperation = 'screen';

            const g1 = ctx.createRadialGradient(
              state.width * (0.35 + Math.sin(state.elapsed * 0.16) * 0.15),
              state.height * (0.3 + Math.cos(state.elapsed * 0.13) * 0.1),
              10,
              state.width * 0.4,
              state.height * 0.35,
              Math.max(state.width, state.height) * 0.65
            );
            g1.addColorStop(0, 'rgba(16, 185, 129, 0.24)');
            g1.addColorStop(0.5, 'rgba(6, 182, 212, 0.09)');
            g1.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = g1;
            ctx.fillRect(0, 0, state.width, state.height);

            const g2 = ctx.createRadialGradient(
              state.width * (0.7 + Math.cos(state.elapsed * 0.14) * 0.15),
              state.height * (0.65 + Math.sin(state.elapsed * 0.17) * 0.1),
              10,
              state.width * 0.65,
              state.height * 0.6,
              Math.max(state.width, state.height) * 0.6
            );
            g2.addColorStop(0, 'rgba(139, 92, 246, 0.2)');
            g2.addColorStop(0.5, 'rgba(236, 72, 153, 0.07)');
            g2.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = g2;
            ctx.fillRect(0, 0, state.width, state.height);

            ctx.restore();
          }

          // 별빛 파티클
          for (let i = 0; i < stars.length; i++) {
            const s = stars[i];
            s.phase += dt * s.twinkleSpeed;
            const alpha = 0.25 + ((Math.sin(s.phase) + 1) * 0.5) * 0.75;

            ctx.save();
            ctx.globalAlpha = alpha;
            ctx.fillStyle = s.color;
            ctx.shadowColor = s.color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // 배경 미니 눈송이
          const snowSprite = sprites.snowflake;
          if (snowSprite) {
            for (let i = 0; i < microSnow.length; i++) {
              const m = microSnow[i];
              m.x += (m.vx + Math.sin(state.elapsed + i) * 6) * dt;
              m.y += m.vy * dt;
              m.angle += m.spin * dt;

              if (m.x < -40) m.x = state.width + 40;
              if (m.x > state.width + 40) m.x = -40;
              if (m.y > state.height + 40) {
                m.y = -40;
                m.x = Math.random() * state.width;
              }

              ctx.save();
              ctx.globalAlpha = m.alpha;
              ctx.translate(m.x, m.y);
              ctx.rotate(m.angle);
              ctx.scale(m.scale, m.scale);
              ctx.drawImage(snowSprite, -120, -120, 240, 240);
              ctx.restore();
            }
          }

          // 메인 LED 아이콘 렌더링
          const margin = 120;
          for (let i = 0; i < icons.length; i++) {
            const item = icons[i];
            item.x += item.vx * dt;
            item.y += item.vy * dt + Math.sin(state.elapsed * 0.85 + item.swayPhase) * 6 * dt;

            if (item.x < -margin) item.x = state.width + margin;
            if (item.x > state.width + margin) item.x = -margin;
            if (item.y < -margin) item.y = state.height + margin;
            if (item.y > state.height + margin) item.y = -margin;

            if (item.isFullSpin) {
              item.angle += item.spinSpeed * dt;
            } else {
              item.swayPhase += item.spinSpeed * dt;
              item.angle = Math.sin(item.swayPhase) * item.swayAmp;
            }

            item.pulsePhase += dt * 1.25;
            const dynamicScale = item.scale * (1 + Math.sin(item.pulsePhase) * 0.04);

            const sprite = sprites[item.type];
            if (sprite) {
              ctx.save();
              ctx.translate(item.x, item.y);
              ctx.rotate(item.angle);
              ctx.scale(dynamicScale, dynamicScale);
              ctx.drawImage(sprite, -120, -120, 240, 240);
              ctx.restore();
            }
          }
        } catch (err) {
          console.error('Render loop warning:', err);
        }

        requestAnimationFrame(animate);
      }

      /**
       * Web Audio API 오르골 자장가 ('고요한 밤 거룩한 밤')
       */
      let audioCtx = null;
      let lullabyTimer = null;
      let noteIdx = 0;

      const SILENT_NIGHT = [
        { f: 392.00, d: 0.65 }, { f: 440.00, d: 0.25 }, { f: 392.00, d: 0.45 }, { f: 329.63, d: 1.15 },
        { f: 392.00, d: 0.65 }, { f: 440.00, d: 0.25 }, { f: 392.00, d: 0.45 }, { f: 329.63, d: 1.15 },
        { f: 587.33, d: 0.85 }, { f: 587.33, d: 0.45 }, { f: 493.88, d: 1.15 },
        { f: 523.25, d: 0.85 }, { f: 523.25, d: 0.45 }, { f: 392.00, d: 1.15 },
        { f: 440.00, d: 0.85 }, { f: 440.00, d: 0.45 }, { f: 523.25, d: 0.65 }, { f: 493.88, d: 0.25 }, { f: 440.00, d: 0.45 },
        { f: 392.00, d: 0.65 }, { f: 440.00, d: 0.25 }, { f: 392.00, d: 0.45 }, { f: 329.63, d: 1.35 }
      ];

      function playBellNote(freq) {
        if (!audioCtx || !state.isMusicOn) return;
        const now = audioCtx.currentTime;

        const osc = audioCtx.createOscillator();
        const overtone = audioCtx.createOscillator();
        const mainGain = audioCtx.createGain();
        const overGain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        overtone.type = 'triangle';
        overtone.frequency.setValueAtTime(freq * 2, now);

        overGain.gain.setValueAtTime(0.025, now);
        overGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.65);

        mainGain.gain.setValueAtTime(0.0001, now);
        mainGain.gain.linearRampToValueAtTime(0.11, now + 0.02);
        mainGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.85);

        osc.connect(mainGain);
        overtone.connect(overGain);
        overGain.connect(mainGain);
        mainGain.connect(audioCtx.destination);

        osc.start(now);
        overtone.start(now);
        osc.stop(now + 1.9);
        overtone.stop(now + 1.9);
      }

      function stepLullaby() {
        if (!state.isMusicOn) return;
        const note = SILENT_NIGHT[noteIdx % SILENT_NIGHT.length];
        playBellNote(note.f);
        noteIdx++;
        lullabyTimer = setTimeout(stepLullaby, note.d * 1000);
      }

      function toggleMusic() {
        state.isMusicOn = !state.isMusicOn;
        const btn = document.getElementById('musicBtn');
        const emoji = document.getElementById('musicEmoji');
        const label = document.getElementById('musicLabel');

        if (state.isMusicOn) {
          if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
              audioCtx = new AudioContextClass();
            }
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          emoji.textContent = '🎵';
          label.textContent = '오르골 켜짐';
          btn.classList.add('music-on');
          stepLullaby();
        } else {
          clearTimeout(lullabyTimer);
          emoji.textContent = '🔇';
          label.textContent = '오르골 끄기';
          btn.classList.remove('music-on');
        }
      }

      /**
       * HUD 컨트롤 및 자동 숨김 (3초)
       */
      const hudContainer = document.getElementById('hudContainer');
      const toastBanner = document.getElementById('toastBanner');
      let hudHideTimer = null;

      function revealHud() {
        hudContainer.classList.remove('hud-hidden');
        hudContainer.classList.add('hud-visible');
        clearTimeout(hudHideTimer);
        hudHideTimer = setTimeout(() => {
          hudContainer.classList.remove('hud-visible');
          hudContainer.classList.add('hud-hidden');
        }, 3000);
      }

      function showToast(msg) {
        toastBanner.textContent = msg;
        toastBanner.classList.add('show');
        setTimeout(() => {
          toastBanner.classList.remove('show');
        }, 3200);
      }

      document.querySelectorAll('.density-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.density = btn.getAttribute('data-density');
          document.querySelectorAll('.density-btn').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          populateScene();
          revealHud();
        });
      });

      document.querySelectorAll('.speed-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-speed');
          state.speedKey = key;
          state.speedMultiplier = SPEED_MAP[key] || 1.0;
          document.querySelectorAll('.speed-btn').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          revealHud();
        });
      });

      document.querySelectorAll('.theme-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.theme = btn.getAttribute('data-theme');
          document.querySelectorAll('.theme-btn').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          revealHud();
        });
      });

      document.getElementById('musicBtn').addEventListener('click', () => {
        toggleMusic();
        revealHud();
      });

      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const fullscreenLabel = document.getElementById('fullscreenLabel');

      fullscreenBtn.addEventListener('click', () => {
        const docEl = document.documentElement;
        const isFs = document.fullscreenElement || document.webkitFullscreenElement;
        if (!isFs) {
          const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
          if (req) {
            req.call(docEl).catch(() => {
              showToast('미리보기 창에서는 F11 키 또는 새 탭에서 전체화면이 동작합니다');
            });
          } else {
            showToast('브라우저 메뉴에서 전체화면을 선택해 주세요');
          }
        } else {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          if (exit) exit.call(document);
        }
        revealHud();
      });

      document.addEventListener('fullscreenchange', () => {
        fullscreenLabel.textContent = document.fullscreenElement ? '창모드' : '전체화면';
        syncCanvasSize(false);
      });

      ['mousemove', 'touchstart', 'keydown'].forEach((evt) => {
        window.addEventListener(evt, revealHud, { passive: true });
      });

      window.addEventListener('resize', () => {
        syncCanvasSize(true);
      });

      // 즉시 초기화 및 렌더링 시작
      buildSprites();
      syncCanvasSize(true);
      requestAnimationFrame(animate);
      revealHud();
      showToast('화면을 터치하거나 리모컨 방향키를 누르면 메뉴가 나타납니다');
    })();
  </script>
</body>
</html>
